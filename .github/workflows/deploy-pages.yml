# GitHub Pages 배포: main에 올라오면 검사(npm run check) 후 dist 폴더를 Pages에 올린다.
# 처음 한 번은 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 남긴다 (진행 중인 배포는 끝까지 둔다)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 데이터·문구 검사, 테스트, 빌드를 모두 통과해야 배포한다
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
